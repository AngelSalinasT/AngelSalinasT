<g opacity="0"><rect x="16" y="118" width="248" height="54" rx="16" fill="#241B33"/><text y="140" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#EDE6F5"><tspan x="29" dy="0">Hi! Do you have time this week</tspan><tspan x="29" dy="19">for a cleaning?</tspan></text><animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.045;0.060;0.96;1"/></g><g opacity="0"><rect x="171" y="182" width="233" height="54" rx="16" fill="#71499A"/><text y="204" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#EDE6F5"><tspan x="184" dy="0">Hi! Yes, we do. Is this your</tspan><tspan x="184" dy="19">first visit with us?</tspan></text><animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.118;0.133;0.96;1"/></g><g opacity="0"><rect x="16" y="246" width="218" height="54" rx="16" fill="#241B33"/><text y="268" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#EDE6F5"><tspan x="29" dy="0">Yes, first time. One of my</tspan><tspan x="29" dy="19">molars hurts too.</tspan></text><animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.209;0.224;0.96;1"/></g><g opacity="0"><rect x="77" y="310" width="266" height="26" rx="13" fill="#1A0E2B" stroke="#38195D"/><text x="210.0" y="327" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#BF94AA">✓ new patient · cleaning + molar check</text><animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.282;0.297;0.96;1"/></g><g opacity="0"><rect x="163" y="348" width="241" height="73" rx="16" fill="#71499A"/><text y="370" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#EDE6F5"><tspan x="176" dy="0">I&#x27;ll book both together. I</tspan><tspan x="176" dy="19">have Thursday 11:00 or Friday</tspan><tspan x="176" dy="19">17:00. Which works for you?</tspan></text><animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.336;0.351;0.96;1"/></g><g opacity="0"><rect x="16" y="431" width="130" height="35" rx="16" fill="#241B33"/><text y="453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#EDE6F5"><tspan x="29" dy="0">Thursday at 11</tspan></text><animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.427;0.442;0.96;1"/></g><g opacity="0"><rect x="97" y="476" width="226" height="26" rx="13" fill="#1A0E2B" stroke="#38195D"/><text x="210.0" y="493" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#BF94AA">✓ appointment booked · Thu 11:00</text><animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.500;0.515;0.96;1"/></g><g opacity="0"><rect x="178" y="514" width="226" height="92" rx="16" fill="#71499A"/><text y="536" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#EDE6F5"><tspan x="191" dy="0">Done! See you Thursday at</tspan><tspan x="191" dy="19">11:00. I&#x27;ll send you the</tspan><tspan x="191" dy="19">location and a reminder the</tspan><tspan x="191" dy="19">day before.</tspan></text><animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.555;0.570;0.96;1"/></g><g opacity="0"><rect x="54" y="616" width="312" height="26" rx="13" fill="#1A0E2B" stroke="#38195D"/><text x="210.0" y="633" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#BF94AA">✓ patient record created · reminder scheduled</text><animate attributeName="opacity" dur="22.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.645;0.660;0.96;1"/></g>
<text x="210.0" y="678" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="10.5" fill="#71499A">A recreation of how the agents I run work. No customer data.</text>
